apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eda-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/vramosr1986-gif/sre-observability-platform.git' # <-- Cambia por la URL de tu repositorio
    targetRevision: HEAD
    path: gitops/helm/eda
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: eda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
