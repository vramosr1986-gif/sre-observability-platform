apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-rulebook
data:
  rulebook.yml: |
    ---
    - name: Reaccionar a alertas
      hosts: localhost
      sources:
        - ansible.eda.alertmanager:
            host: 0.0.0.0
            port: 5000
          filters:
            - eda.builtin.json_filter:
                exclude_keys:
                  - hosts
      rules:
        - name: Alertas SRE
          condition: event.alert.labels.alertname in ["HighCPU", "HighMemory", "PodNotReady"]
          action:
            run_playbook:
              name: /rulebook/notify.yml
  inventory.yml: |
{{ .Files.Get "files/inventory.yml" | indent 4 }}
  notify.yml: |
{{ .Files.Get "files/notify.yml" | indent 4 }}
