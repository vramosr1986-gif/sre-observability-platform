apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eda
  template:
    metadata:
      labels:
        app: eda
    spec:
      containers:
        - name: eda
          image: quay.io/ansible/ansible-rulebook:v1.3.2
          args:
            - ansible-rulebook
            - --rulebook
            - /rulebook/rulebook.yml
          volumeMounts:
            - name: rulebook
              mountPath: /rulebook
      volumes:
        - name: rulebook
          configMap:
            name: eda-rulebook
