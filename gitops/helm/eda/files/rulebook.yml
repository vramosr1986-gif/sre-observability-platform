---
# ============================================================
# EDA - Etapa 1: probar el transporte
# ============================================================
# ansible-rulebook es el software (ya viene en la imagen de Docker).
# Este fichero es la configuracion: que tiene que escuchar y que
# tiene que hacer cuando le llegue algo.
#
# Para esta etapa la accion es `print`, que solo escribe en el log.
# No necesita inventario, ni playbook, ni permisos en Kubernetes.
# ============================================================

- name: Demo EDA
  hosts: localhost

  # El source es de donde vienen los eventos. Este abre un servidor
  # HTTP que espera POSTs en el puerto 5000.
  sources:
    - eda.builtin.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # Cada regla es: SI (condition) ENTONCES (action).
    # La condition evita que dispare con cualquier POST vacio.
    - name: Ver que llega una alerta
      condition: event.payload is defined
      action:
        # `print_event` es la accion mas simple: imprime y ya.
        #
        # OJO: la clave se llama `print_event`, NO `print`. Y dentro solo
        # admite `var_root` (la expresion a imprimir) y `pretty` (booleano).
        # Cualquier otra clave hace que ansible-rulebook se NIEGUE A ARRANCAR:
        # valida el rulebook contra ruleset_schema.json al inicio y no valiendo,
        # aborta. Es a favor: el error sale al arrancar, no tres horas despues.
        #
        # El esquema esta en el propio paquete:
        #   /app/ansible_rulebook/schema/ruleset_schema.json
        print_event:
          var_root: "{{ event.payload.alerts[0].labels }}"
          pretty: true
