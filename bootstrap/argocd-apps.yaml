apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  # Sin ignoreDifferences: esta app no gestiona ninguna CRD. El chart se renderiza
  # con skipCrds: true y bootstrap.sh las instala con kubectl apply --server-side.
  # Si se adoptaran aqui, Argo peleria con el Prometheus Operator por su propiedad.

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 55.0.0

    helm:
      skipCrds: true

      values: |
        grafana:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d

        additionalPrometheusRulesMap:

          high-cpu-alert:
            groups:
              - name: cpu
                rules:
                  - alert: HighCPU
                    expr: |
                      100 - (
                        avg by(instance) (
                          rate(node_cpu_seconds_total{mode="idle"}[5m])
                        ) * 100
                      ) > 10
                    for: 1m

                    labels:
                      severity: warning

                    annotations:
                      summary: "CPU alta en {{ $labels.instance }}"
                      description: "Uso de CPU superior al 10% durante 1 minuto en {{ $labels.instance }}"

          high-memory-alert:
            groups:
              - name: memory
                rules:
                  - alert: HighMemory
                    expr: |
                      (
                        1 - (
                          node_memory_MemAvailable_bytes
                          /
                          node_memory_MemTotal_bytes
                        )
                      ) * 100 > 10
                    for: 1m

                    labels:
                      severity: warning

                    annotations:
                      summary: "Memoria alta en {{ $labels.instance }}"
                      description: "Uso de memoria superior al 30% durante 1 minutos en {{ $labels.instance }}"
          pod-not-ready:
            groups:
             - name: pods
               rules:
                 - alert: PodNotReady
                   expr: |
                     kube_pod_status_ready{condition="false", namespace!~"kube-system|argocd"} == 1
                   for: 1m
                   labels:
                     severity: warning
                   annotations:
                     summary: "Pod no listo: {{ $labels.pod }}"
                     description: "El pod {{ $labels.pod }} lleva más de 1 minuto sin estar Ready"          
        alertmanager:
          config:
            route:
              receiver: default
              group_by:
                - alertname
              group_wait: 10s
              group_interval: 30s
              repeat_interval: 30s
              routes:
                - receiver: alertas-para-eda
                  matchers:
                    - alertname =~ "^(HighCPU|HighMemory|PodNotReady)$"
            receivers:
              - name: default
              - name: alertas-para-eda
                webhook_configs:
                  - url: http://eda.eda.svc.cluster.local:5000/endpoint
                    send_resolved: true
          alertmanagerSpec:
            logLevel: debug
  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 7.0.19

    helm:
      values: |
        adminPassword: admin

        # Sin un datasource, los dashboards de kube-prometheus-stack se quedan en
        # "No data": referencian la variable ${ds_prometheus} y no hay nada que
        # resolver. La URL es el Service de Prometheus del mismo namespace.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090
                isDefault: true
                editable: false
                jsonData:
                  timeInterval: 30s

        # Dashboard versionado: Node Exporter Full (grafana.com 1860) se descarga
        # al arrancar y se provisiona desde fichero, asi sobrevive a cada rebuild.
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default

        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 37
              datasource: Prometheus

        service:
          type: ClusterIP

        # El chart fija domain=grafana.local, asi que Grafana construye su
        # root_url con ese host y el navegador (en localhost:3000 por
        # port-forward) recibe "Failed to fetch" al pedir cualquier API.
        # Se fija root_url al host por el que se accede de verdad.
        grafana.ini:
          server:
            root_url: http://localhost:3000
            domain: localhost

        ingress:
          enabled: true
          ingressClassName: nginx

          hosts:
            - grafana.local

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vramosr1986-gif/sre-observability-platform.git
    targetRevision: main
    path: gitops/helm/demo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: applications

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
